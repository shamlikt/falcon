<!doctype html><html><head><meta charset="utf-8"><title>splat preview</title>
<style>html,body{margin:0;background:#0A0C12;height:100%}canvas{position:fixed;inset:0;width:100vw;height:100vh}#hud{position:fixed;left:8px;top:8px;color:#fff;font:12px monospace;z-index:2}</style></head>
<body><canvas id="c"></canvas><div id="hud"></div>
<script src="../splat.js"></script>
<script>
const q = new URLSearchParams(location.search);
const up = (q.get('up') || '0,-1,0').split(',').map(Number);
const center = (q.get('center') || '-0.0014,-0.0482,-0.3184').split(',').map(Number);
const yaw = parseFloat(q.get('yaw') || '0'), pitch = parseFloat(q.get('pitch') || '0'), dist = parseFloat(q.get('dist') || '4.2');
const assemble = parseFloat(q.get('a') || '1');
const S = FalconSplat.create(document.getElementById('c'), { center, up, fov: 34, accent: '#F7B32B' });
S.set({ yaw, pitch, dist, assemble });
S.on('ready', n => { window.__ready = n; });
S.on('progress', p => { window.__prog = p; });
setInterval(() => { document.getElementById('hud').textContent = `n=${S.state.count} draw=${S.state.drawCount} yaw=${yaw} pitch=${pitch} dist=${dist} up=${up} a=${assemble}`; }, 100);
S.load('../assets/avatar.splat');
window.__S = S;
</script></body></html>
