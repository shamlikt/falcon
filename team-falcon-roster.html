<title>Team Falcon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@300;400;500;600;700&family=Spectral:ital,wght@0,500;0,600;1,400;1,500;1,600&display=swap">
<style>
  :root {
    /* light / parchment theme (default) */
    --bg: #efe4cf;
    --bg-2: #e6d7bc;
    --surface: #fbf4e6;
    --surface-edge: rgba(58,11,16,.12);
    --ink: #35090e;
    --ink-soft: #6a2b26;
    --muted: #8a5a4e;
    --gold: #a8781f;
    --gold-bright: #c79226;
    --gold-soft: rgba(168,120,31,.16);
    --shadow: 24px 40px 80px -48px rgba(53,9,14,.55);
    --hero-glow: radial-gradient(120% 90% at 50% -10%, rgba(199,146,38,.20), transparent 60%);
    --vignette: transparent;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #240809;
      --bg-2: #16050a;
      --surface: #431019;
      --surface-edge: rgba(232,184,75,.22);
      --ink: #f7ece0;
      --ink-soft: #ecc9bf;
      --muted: #cf9d94;
      --gold: #e8b84b;
      --gold-bright: #f6d888;
      --gold-soft: rgba(232,184,75,.12);
      --shadow: 24px 44px 90px -46px rgba(0,0,0,.8);
      --hero-glow: radial-gradient(120% 90% at 50% -10%, rgba(232,184,75,.22), transparent 62%);
      --vignette: radial-gradient(140% 120% at 50% 0%, transparent 45%, rgba(0,0,0,.55));
    }
  }
  :root[data-theme="dark"] {
    --bg: #240809;
    --bg-2: #16050a;
    --surface: #431019;
    --surface-edge: rgba(232,184,75,.22);
    --ink: #f7ece0;
    --ink-soft: #ecc9bf;
    --muted: #cf9d94;
    --gold: #e8b84b;
    --gold-bright: #f6d888;
    --gold-soft: rgba(232,184,75,.12);
    --shadow: 24px 44px 90px -46px rgba(0,0,0,.8);
    --hero-glow: radial-gradient(120% 90% at 50% -10%, rgba(232,184,75,.22), transparent 62%);
    --vignette: radial-gradient(140% 120% at 50% 0%, transparent 45%, rgba(0,0,0,.55));
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background:
      var(--vignette),
      var(--hero-glow),
      linear-gradient(180deg, var(--bg) 0%, var(--bg-2) 100%);
    background-attachment: fixed;
    color: var(--ink);
    font-family: "Oswald", "Segoe UI", system-ui, sans-serif;
    font-weight: 300;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    min-height: 100vh;
  }

  .wrap { max-width: 1120px; margin: 0 auto; padding: clamp(28px, 6vw, 72px) clamp(18px, 5vw, 48px) 64px; }

  /* ---------- hero ---------- */
  .hero { text-align: center; position: relative; }
  .crest { width: clamp(78px, 16vw, 120px); height: auto; margin: 0 auto 6px; display: block; filter: drop-shadow(0 8px 20px rgba(0,0,0,.35)); }
  .eyebrow {
    font-family: "Oswald", sans-serif; font-weight: 500; letter-spacing: .42em;
    text-transform: uppercase; font-size: clamp(10px, 1.5vw, 13px);
    color: var(--gold); margin: 4px 0 0; padding-left: .42em;
  }
  .wordmark {
    font-family: "Anton", "Oswald", sans-serif; font-weight: 400;
    font-size: clamp(52px, 15vw, 132px); line-height: .86; letter-spacing: .01em;
    margin: 6px 0 0; text-transform: uppercase; text-wrap: balance;
    background: linear-gradient(176deg, var(--gold-bright), var(--gold) 55%, var(--ink-soft));
    -webkit-background-clip: text; background-clip: text; color: transparent;
    -webkit-text-fill-color: transparent;
  }
  .tagline {
    font-family: "Spectral", Georgia, serif; font-style: italic; font-weight: 500;
    font-size: clamp(15px, 2.6vw, 22px); color: var(--ink-soft);
    margin: 10px auto 0; max-width: 34ch; text-wrap: balance;
  }
  .rule { display: flex; align-items: center; justify-content: center; gap: 14px; margin: 26px auto 0; color: var(--gold); }
  .rule::before, .rule::after { content: ""; height: 1px; width: min(120px, 22vw); background: linear-gradient(90deg, transparent, var(--gold)); }
  .rule::after { background: linear-gradient(90deg, var(--gold), transparent); }
  .rule span { font-family: "Oswald", sans-serif; text-transform: uppercase; letter-spacing: .3em; font-size: 11px; }

  /* ---------- section heading ---------- */
  .sec-head { display: flex; align-items: baseline; gap: 14px; margin: 56px 0 22px; }
  .sec-head h2 {
    font-family: "Anton", sans-serif; font-weight: 400; text-transform: uppercase;
    font-size: clamp(22px, 4.4vw, 34px); letter-spacing: .02em; margin: 0; color: var(--ink);
  }
  .sec-head .count { font-family: "Oswald", sans-serif; font-weight: 500; color: var(--gold); letter-spacing: .18em; font-size: 13px; text-transform: uppercase; }
  .sec-head .line { flex: 1; height: 1px; background: linear-gradient(90deg, var(--surface-edge), transparent); }

  /* ---------- captains ---------- */
  .captains { display: grid; grid-template-columns: repeat(2, 1fr); gap: clamp(14px, 3vw, 26px); }
  @media (max-width: 560px) { .captains { grid-template-columns: 1fr; } }

  /* ---------- card grid ---------- */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: clamp(14px, 2.4vw, 22px); }

  /* ---------- card ---------- */
  .card {
    position: relative; background: var(--surface);
    border: 1px solid var(--surface-edge); border-radius: 16px; overflow: hidden;
    box-shadow: var(--shadow); display: flex; flex-direction: column;
    transition: transform .6s cubic-bezier(.2,.7,.2,1), opacity .6s ease, box-shadow .35s ease, border-color .35s ease;
  }
  .js .card { transform: translateY(16px); opacity: 0; }
  .card.in { transform: none; opacity: 1; }
  .card:hover { border-color: var(--gold); box-shadow: var(--shadow), 0 0 0 1px var(--gold-soft), 0 22px 48px -30px var(--gold-soft); }
  .card__media { position: relative; aspect-ratio: 5 / 4; background: #140406; }
  .card__media svg { width: 100%; height: 100%; display: block; }
  .card__flag {
    position: absolute; top: 10px; left: 10px; z-index: 2;
    font-family: "Oswald", sans-serif; font-weight: 600; text-transform: uppercase;
    letter-spacing: .18em; font-size: 10px; color: #2a0a0e;
    background: linear-gradient(180deg, var(--gold-bright), var(--gold)); padding: 4px 10px; border-radius: 999px;
  }
  .card__body { padding: 16px 16px 18px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
  .card__name {
    font-family: "Oswald", sans-serif; font-weight: 600; text-transform: uppercase;
    letter-spacing: .04em; font-size: clamp(17px, 2.4vw, 20px); margin: 0; color: var(--ink);
    line-height: 1.05;
  }
  .card__caption {
    font-family: "Spectral", Georgia, serif; font-style: italic; font-weight: 500;
    font-size: 14.5px; line-height: 1.45; color: var(--ink-soft); margin: 0; flex: 1;
  }
  .card__event {
    display: inline-flex; align-items: center; gap: 8px; margin-top: 4px;
    font-family: "Oswald", sans-serif; font-weight: 500; text-transform: uppercase;
    letter-spacing: .12em; font-size: 10.5px; color: var(--gold);
  }
  .card__event::before { content: ""; width: 14px; height: 1px; background: var(--gold); }

  .card--captain { border-color: var(--gold); }
  .card--captain .card__media { aspect-ratio: 4 / 3; }

  /* ---------- events banner ---------- */
  .events { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
  .event {
    background: var(--surface); border: 1px solid var(--surface-edge); border-left: 3px solid var(--gold);
    border-radius: 10px; padding: 14px 16px; display: flex; flex-direction: column; gap: 3px;
  }
  .event .idx { font-family: "Anton", sans-serif; font-size: 13px; color: var(--gold); letter-spacing: .1em; }
  .event .epic { font-family: "Oswald", sans-serif; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; font-size: 15px; color: var(--ink); line-height: 1.1; }
  .event .real { font-family: "Spectral", serif; font-style: italic; font-size: 13px; color: var(--muted); }

  /* ---------- footer ---------- */
  footer { text-align: center; margin-top: 64px; padding-top: 26px; border-top: 1px solid var(--surface-edge); color: var(--muted); }
  footer .fw { font-family: "Anton", sans-serif; color: var(--gold); letter-spacing: .12em; font-size: 15px; text-transform: uppercase; }
  footer .sub { font-family: "Oswald", sans-serif; font-weight: 300; letter-spacing: .16em; text-transform: uppercase; font-size: 11px; margin-top: 6px; }

  /* ---------- theme toggle ---------- */
  .toggle {
    position: fixed; top: 14px; right: 14px; z-index: 20;
    background: var(--surface); color: var(--ink); border: 1px solid var(--surface-edge);
    border-radius: 999px; width: 40px; height: 40px; cursor: pointer; font-size: 17px;
    display: grid; place-items: center; box-shadow: var(--shadow);
    transition: border-color .3s ease, transform .3s ease;
  }
  .toggle:hover { border-color: var(--gold); transform: rotate(-12deg); }
  .toggle:focus-visible, .card:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }

  .js .hero > * { opacity: 0; transform: translateY(14px); animation: rise .8s cubic-bezier(.2,.7,.2,1) forwards; }
  .hero .crest { animation-delay: .02s; }
  .hero .eyebrow { animation-delay: .10s; }
  .hero .wordmark { animation-delay: .16s; }
  .hero .tagline { animation-delay: .28s; }
  .hero .rule { animation-delay: .40s; }
  @keyframes rise { to { opacity: 1; transform: none; } }

  @media (prefers-reduced-motion: reduce) {
    .hero > *, .card { animation: none !important; opacity: 1 !important; transform: none !important; transition: none !important; }
  }
</style>

<script>document.documentElement.classList.add("js");</script>
<button class="toggle" id="toggle" aria-label="Toggle light and dark theme" title="Toggle theme">◐</button>

<div class="wrap">
  <header class="hero">
    <svg class="crest" viewBox="0 0 100 100" role="img" aria-label="Team Falcon crest">
      <circle cx="50" cy="50" r="47" fill="none" stroke="var(--gold)" stroke-width="1.4" opacity=".55"/>
      <circle cx="50" cy="50" r="42" fill="none" stroke="var(--gold)" stroke-width="2.4"/>
      <g fill="var(--gold)">
        <!-- right wing -->
        <path d="M50,70 C57,64 61,62 70,53 L62,55 C68,49 71,45 77,38 L68,41 C74,34 77,30 80,22 C69,31 60,42 54,54 C52,59 51,64 50,70 Z"/>
        <!-- left wing -->
        <path d="M50,70 C43,64 39,62 30,53 L38,55 C32,49 29,45 23,38 L32,41 C26,34 23,30 20,22 C31,31 40,42 46,54 C48,59 49,64 50,70 Z"/>
        <!-- head + beak -->
        <circle cx="50" cy="34" r="6.6"/>
        <path d="M50,31 L59,33 L50,38 Z"/>
      </g>
      <circle cx="47.6" cy="33" r="1.5" fill="#160406"/>
    </svg>
    <p class="eyebrow">Sports Day &middot; MMXXVI</p>
    <h1 class="wordmark">Team Falcon</h1>
    <p class="tagline">Sixteen souls, one crest, and a rope that never stood a chance.</p>
    <div class="rule"><span>Captains &middot; Lifin &amp; Ashna</span></div>
  </header>

  <section aria-labelledby="cap-h">
    <div class="sec-head">
      <h2 id="cap-h">The Captains</h2>
      <span class="line"></span>
      <span class="count">Command</span>
    </div>
    <div class="captains" id="captains"></div>
  </section>

  <section aria-labelledby="ev-h">
    <div class="sec-head">
      <h2 id="ev-h">The Campaigns</h2>
      <span class="line"></span>
      <span class="count">7 Trials</span>
    </div>
    <div class="events" id="events"></div>
  </section>

  <section aria-labelledby="sq-h">
    <div class="sec-head">
      <h2 id="sq-h">The Squad</h2>
      <span class="line"></span>
      <span class="count">14 Legends</span>
    </div>
    <div class="grid" id="squad"></div>
  </section>

  <footer>
    <div class="fw">Team Falcon</div>
    <div class="sub">Fear the crest &middot; Fear the rope</div>
  </footer>
</div>

<script>
  // ----- dramatized campaigns (real game -> epic title) -----
  const EVENTS = [
    { epic: "The Odyssey of the War of Thugs", real: "Tug of War" },
    { epic: "Rise of the Net Titans",          real: "Volleyball" },
    { epic: "The Grand Chaos Gauntlet",        real: "Fun Games" },
    { epic: "The Everlasting Sprint Saga",     real: "Relay Race" },
    { epic: "Throne of the Last Seat",         real: "Musical Chairs" },
    { epic: "The Balance of Fates",            real: "Lemon & Spoon" },
    { epic: "The Leap of a Thousand Bounds",   real: "Sack Race" },
  ];

  // ----- roster (order matches the source card) -----
  const PEOPLE = [
    { name: "Lifin", initials: "LF", num: 10, captain: true, event: 0,
      caption: "Supreme Warlord of the Odyssey of the War of Thugs — where the rope leads, legends follow." },
    { name: "Ashna", initials: "AS", num: 7, captain: true, event: 1,
      caption: "Co-Sovereign of the Falcons — serene in the storm, merciless at the net." },

    { name: "Nabeela Abdul", initials: "NA", num: 4, event: 2,
      caption: "Keeper of the Grand Chaos Gauntlet — turns every fun game into a documented conquest." },
    { name: "Hamsa", initials: "HM", num: 9, event: 3,
      caption: "Oracle of the Everlasting Sprint Saga — at the finish line before the whistle believes it." },
    { name: "AnsinaMHaroon", initials: "AH", num: 3, event: 5,
      caption: "Empress of the Balance of Fates — one lemon, one spoon, zero doubt." },
    { name: "Shamlik", initials: "SK", num: 8, event: 2,
      caption: "Chaos Strategist of the Grand Chaos Gauntlet — loses with dignity, wins with suspicion." },
    { name: "RemyaK", initials: "RK", num: 11, event: 1,
      caption: "Duchess of the Net Titans — spikes first, apologizes never." },
    { name: "AhamedKabir", initials: "AK", num: 5, event: 0,
      caption: "Ironhand of the War of Thugs — the rope has filed a formal complaint." },
    { name: "Bajal", initials: "BJ", num: 6, event: 6,
      caption: "Baron of the Leap of a Thousand Bounds — gravity is treated as a polite suggestion." },
    { name: "PMMuneer", initials: "PM", num: 2, event: 3,
      caption: "Marshal of the Everlasting Sprint Saga — runs like the deadline is personal." },
    { name: "SakeerSheik", initials: "SS", num: 12, event: 4,
      caption: "Sultan of the Last Seat — when the music stops, the throne is already his." },
    { name: "SinashShajahan", initials: "SJ", num: 15, event: 0,
      caption: "Colossus of the War of Thugs — anchors the line like a small, stubborn mountain." },
    { name: "Basheer", initials: "BR", num: 14, event: 1,
      caption: "Sentinel of the Net Titans — the net has never once won an argument." },
    { name: "SarinJalal", initials: "SL", num: 21, event: 2,
      caption: "Herald of the Grand Chaos Gauntlet — rules optional, glory mandatory." },
    { name: "Shameer", initials: "SM", num: 17, event: 6,
      caption: "Vanguard of the Leap of a Thousand Bounds — half athlete, half kangaroo, fully committed." },
    { name: "Reas", initials: "RS", num: 23, event: 5,
      caption: "Warden of the Balance of Fates — steady hands, steadier nerves, suspiciously fast walk." },
  ];

  // ----- jersey colorways (maroon / wine / rust family) -----
  const KITS = [
    "#6d1622", "#7c1e1a", "#5a1220", "#8a3120",
    "#641530", "#4e1018", "#963a22", "#701a2c",
  ];
  const GOLD = "#e8b84b", CREAM = "#f7ece0", DEEP = "#2a0a0e";

  let uid = 0;
  function jersey(p) {
    const gid = "g" + (uid++);
    const capt = !!p.captain;
    const fill = capt ? GOLD : KITS[p.num % KITS.length];
    const ink = capt ? DEEP : CREAM;
    const trim = capt ? DEEP : GOLD;
    return `
    <svg viewBox="0 0 100 120" role="img" aria-label="${p.name}, jersey number ${p.num}">
      <defs>
        <radialGradient id="${gid}" cx="50%" cy="32%" r="78%">
          <stop offset="0" stop-color="#3c0d14"/><stop offset="1" stop-color="#120305"/>
        </radialGradient>
      </defs>
      <rect width="100" height="120" fill="url(#${gid})"/>
      <g opacity="0.09" stroke="#e8b84b" stroke-width="1.2" fill="none">
        <path d="M-5,96 L50,70 L105,96"/><path d="M-5,108 L50,82 L105,108"/>
      </g>
      <path d="M32,26 L22,31 L11,55 L26,61 L31,50 L31,100 L69,100 L69,50 L74,61 L89,55 L78,31 L68,26 C62,36 38,36 32,26 Z"
            fill="${fill}" stroke="${trim}" stroke-width="1.6" stroke-linejoin="round"/>
      <path d="M32,26 C38,36 62,36 68,26" fill="none" stroke="${trim}" stroke-width="2.4"/>
      <text x="50" y="47" text-anchor="middle" font-family="Oswald, sans-serif" font-weight="600"
            font-size="11" letter-spacing="1.6" fill="${ink}">${p.initials.toUpperCase()}</text>
      <text x="50" y="90" text-anchor="middle" font-family="Anton, sans-serif"
            font-size="42" fill="${ink}">${p.num}</text>
    </svg>`;
  }

  function card(p) {
    const el = document.createElement("article");
    el.className = "card" + (p.captain ? " card--captain" : "");
    el.tabIndex = 0;
    const flag = p.captain ? `<span class="card__flag">★ Captain</span>` : "";
    el.innerHTML = `
      <div class="card__media">${flag}${jersey(p)}</div>
      <div class="card__body">
        <h3 class="card__name">${p.name}</h3>
        <p class="card__caption">${p.caption}</p>
        <span class="card__event">${EVENTS[p.event].epic}</span>
      </div>`;
    return el;
  }

  const capWrap = document.getElementById("captains");
  const sqWrap = document.getElementById("squad");
  PEOPLE.filter(p => p.captain).forEach(p => capWrap.appendChild(card(p)));
  PEOPLE.filter(p => !p.captain).forEach(p => sqWrap.appendChild(card(p)));

  const evWrap = document.getElementById("events");
  EVENTS.forEach((e, i) => {
    const d = document.createElement("div");
    d.className = "event";
    d.innerHTML = `<span class="idx">${String(i + 1).padStart(2, "0")}</span>
                   <span class="epic">${e.epic}</span>
                   <span class="real">${e.real}</span>`;
    evWrap.appendChild(d);
  });

  // ----- reveal on scroll -----
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (!reduce && "IntersectionObserver" in window) {
    const io = new IntersectionObserver((entries) => {
      entries.forEach((en, k) => {
        if (en.isIntersecting) {
          en.target.style.transitionDelay = (k % 6) * 60 + "ms";
          en.target.classList.add("in");
          io.unobserve(en.target);
        }
      });
    }, { threshold: 0.12 });
    document.querySelectorAll(".card").forEach(c => io.observe(c));
  } else {
    document.querySelectorAll(".card").forEach(c => c.classList.add("in"));
  }

  // ----- theme toggle (persisted per viewer) -----
  const root = document.documentElement, tgl = document.getElementById("toggle");
  try { const s = localStorage.getItem("falcon-theme"); if (s) root.setAttribute("data-theme", s); } catch (e) {}
  tgl.addEventListener("click", () => {
    const dark = matchMedia("(prefers-color-scheme: dark)").matches;
    const cur = root.getAttribute("data-theme") || (dark ? "dark" : "light");
    const next = cur === "dark" ? "light" : "dark";
    root.setAttribute("data-theme", next);
    try { localStorage.setItem("falcon-theme", next); } catch (e) {}
  });
</script>
